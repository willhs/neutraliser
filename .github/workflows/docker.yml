name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/willhs/neutraliser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: neutraliser:smoke
          cache-from: type=gha
      - name: Smoke test image
        run: |
          docker run --rm neutraliser:smoke version
          docker run --rm --entrypoint ffmpeg -v "$PWD:/media" neutraliser:smoke \
            -loglevel error -f lavfi -i sine=frequency=440:duration=2 \
            -f lavfi -i color=c=black:s=64x64:d=2 -c:a aac -c:v libx264 -shortest /media/smoke.mkv
          docker run --rm -v "$PWD:/media" neutraliser:smoke process /media/smoke.mkv --dry-run
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-medic:
    needs: [image]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Report failure to medic
        env:
          MEDIC_URL: https://medic.willhs.me
          MEDIC_SECRET: ${{ secrets.MEDIC_SHARED_SECRET }}
          # Cloudflare Access service token; the CF-Access headers are sent only when both are set.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          workflow_file="${GITHUB_WORKFLOW_REF%%@*}"; workflow_file="${workflow_file##*/}"
          cf_access=()
          if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
            cf_access=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          fi
          curl -fsS --max-time 15 -X POST "${MEDIC_URL}/incident" \
            "${cf_access[@]}" \
            -H "X-Medic-Secret: ${MEDIC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg branch "${GITHUB_REF_NAME}" \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --arg run_url "${RUN_URL}" \
              --arg workflow "${workflow_file}" \
              --arg conclusion "failure" \
              --arg head_sha "${GITHUB_SHA}" \
              --arg actor "${GITHUB_ACTOR}" \
              '{source:"ci", repo:$repo, branch:$branch, run_id:$run_id, run_url:$run_url, workflow:$workflow, conclusion:$conclusion, head_sha:$head_sha, actor:$actor}')" \
            || echo "::warning::medic unreachable; failure not paged"
