name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/willhs/neutraliser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: neutraliser:smoke
          cache-from: type=gha
      - name: Smoke test image
        run: |
          docker run --rm neutraliser:smoke version
          docker run --rm --entrypoint ffmpeg -v "$PWD:/media" neutraliser:smoke \
            -loglevel error -f lavfi -i sine=frequency=440:duration=2 \
            -f lavfi -i color=c=black:s=64x64:d=2 -c:a aac -c:v libx264 -shortest /media/smoke.mkv
          docker run --rm -v "$PWD:/media" neutraliser:smoke process /media/smoke.mkv --dry-run
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
