name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rubocop

  rspec:
    name: rspec (ffmpeg ${{ matrix.ffmpeg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest ffmpeg the README claims (4.2.x); static build from johnvansickle.com.
          - ffmpeg: '4.2.2'
            url: https://johnvansickle.com/ffmpeg/old-releases/ffmpeg-4.2.2-amd64-static.tar.xz
          # First release with Atmos/DTS:X detection support (7.1+); pinned BtbN static build.
          - ffmpeg: '7.1'
            url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-02-28-13-02/ffmpeg-n7.1-214-g71889a8437-linux64-gpl-7.1.tar.xz
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install static ffmpeg ${{ matrix.ffmpeg }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-dl" "$HOME/ffmpeg-bin"
          curl -fsSL --retry 3 "${{ matrix.url }}" | tar -xJ -C "$RUNNER_TEMP/ffmpeg-dl"
          find "$RUNNER_TEMP/ffmpeg-dl" -type f \( -name ffmpeg -o -name ffprobe \) -exec cp {} "$HOME/ffmpeg-bin/" \;
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
      - name: Show ffmpeg version
        run: |
          ffmpeg -version
          ffprobe -version
      - run: bundle exec rspec
