AllCops:
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 75

Metrics/BlockLength:
  AllowedMethods:
    - popen3
  Exclude:
    - '*.gemspec'
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 400

Metrics/CyclomaticComplexity:
  Max: 30

Metrics/MethodLength:
  Max: 55

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Max: 30

Naming/MethodParameterName:
  AllowedNames:
    - tp
